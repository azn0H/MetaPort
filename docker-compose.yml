services:
  metaport-backend:
    build:
      context: ./backend
    dns:
      - 8.8.8.8
      - 1.1.1.1
    container_name: metaport-backend
    restart: unless-stopped
    ports:
      - "8025:8025"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
      - ./backend/docs:/app/docs
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/run/dbus/system_bus_socket:/var/run/dbus/system_bus_socket
      - /mnt:/host_mnt:ro
      - /media:/host_media:ro
      - /proc/mounts:/host_proc_mounts:ro
    depends_on:
      - metaport-db
    networks:
      - sdilena_databazova_sit

  metaport-frontend:
    build:
      context: ./frontend
    dns:
      - 8.8.8.8
      - 1.1.1.1
    container_name: metaport-frontend
    restart: unless-stopped
    ports:
      - "85:80"
    networks:
      - sdilena_databazova_sit

  metaport-db:
    image: postgres:15
    container_name: metaport-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-metaportdb}
    volumes:
      - metaport_pgdata:/var/lib/postgresql/data
    networks:
      - sdilena_databazova_sit

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: metaport-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    env_file:
      - ./backend/.env
    networks:
      - sdilena_databazova_sit

volumes:
  metaport_pgdata:

networks:
  sdilena_databazova_sit:
    external: true
