services:
  metaport-backend:
    build: ./backend
    container_name: metaport-backend
    restart: unless-stopped
    # Port už nemusíš mapovat na hostitele (host:container), 
    # protože tunel bude komunikovat přímo přes Docker síť
    expose:
      - "8025"

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=TVUJ_TAJNY_TOKEN_Z_CLOUDFLARE