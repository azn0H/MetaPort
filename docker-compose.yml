services:
  metaport-backend:
    build: ./backend
    container_name: metaport-backend
    restart: unless-stopped
    expose:
      - "8025"
    volumes:
      - ./backend/docs:/app/docs
      - ./backend/.env:/app/.env

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: metaport-cloudflared
    restart: unless-stopped
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}