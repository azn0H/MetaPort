services:
  metaport-backend:
    build: ./backend
    container_name: metaport-backend
    restart: unless-stopped
    expose:
      - "8025"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/docs:/app/docs
      - /var/run/docker.sock:/var/run/docker.sock

  metaport-frontend:
    build: ./frontend
    container_name: metaport-frontend
    restart: unless-stopped
    expose:
      - "85"

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: metaport-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    env_file:
      - ./backend/.env